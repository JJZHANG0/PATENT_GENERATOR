name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Verify JavaScript and application rules
        run: |
          node --check dist/app.js
          node --check dist/export.js
          node --check dist/ai.js
          node --check dist/ai-fields.js
          node --check dist/ai-core.mjs
          node --check dist/ai-prompt.mjs
          node scripts/test-validation.cjs
          node scripts/test-public-config.cjs
          node --test scripts/test-ai.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
